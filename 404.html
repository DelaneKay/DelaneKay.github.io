<!doctype html>
<html lang="en">
  <head>

    <meta name="theme-color" content="#07111f" />

        box-sizing: border-box;
      }
      body {
        display: grid;

        background: #0e1d30;
        border: 1px solid rgba(149, 180, 210, 0.22);
        border-radius: 24px;
      }
      p:first-child {
        color: #ffad32;
        font-family: ui-monospace, monospace;
        font-size: 0.72rem;
        letter-spacing: 0.12em;
      }
      h1 {
        margin: 12px 0;
        font-size: clamp(3rem, 12vw, 7rem);
        letter-spacing: -0.08em;
      }
      p:not(:first-child) {
        color: #96a9ba;
        line-height: 1.7;
      }
      a {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        margin-top: 22px;
        padding: 0 20px;
        color: #07111f;
        font-weight: 800;
        text-decoration: none;
